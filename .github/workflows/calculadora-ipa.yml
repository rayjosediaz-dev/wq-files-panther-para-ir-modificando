name: Panther iOS - Calculadora - IPA sin firmar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSFive.xcodeproj
      - name: Compilar IPA sin firma
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Panther-Calculadora-unsigned.ipa Payload
      - name: Publicar archivo IPA
        uses: actions/upload-artifact@v4
        with:
          name: Panther-Calculadora-unsigned
          path: Panther-Calculadora-unsigned.ipa
          if-no-files-found: error
